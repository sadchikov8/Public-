name: Оновлення сайту

on:
  schedule:
    - cron: "17 * * * *"      # щогодини
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуску
  push:
    branches: [main, v2]
    paths: ["build/**", "assets/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow google-api-python-client google-auth
      - name: Дані з таблиці «Сайт»
        env:
          USED_CSV_URL: ${{ vars.USED_CSV_URL }}
          NEW_CSV_URL: ${{ vars.NEW_CSV_URL }}
        run: python build/build.py --fetch
      - name: Фото з Google Диска
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          DRIVE_ROOT_ID: ${{ vars.DRIVE_ROOT_ID }}
        run: python build/sync_photos.py
      - name: Збірка сторінок
        run: python build/build.py
      - name: Зберегти зміни
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "Оновлення сайту $(date -u +%F\ %H:%M)"
          git push
